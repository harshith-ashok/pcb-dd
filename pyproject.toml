[project]
name = "pcb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ultralytics>=8.3.0",
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "kagglehub>=0.3.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxslim>=0.1.96",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
